<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Haz. — Portfolio</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* ─── Design system tokens ─── */
  :root {
    --paper: #F5F3EE;
    --paper-deep: #ECEAE3;
    --ink-panel: #1A1815;
    --ink: #1A1815;
    --ink-hover: #2A2722;
    --ink-12: rgba(26, 24, 21, 0.12);
    --ink-22: rgba(26, 24, 21, 0.22);
    --ink-42: rgba(26, 24, 21, 0.42);
    --ink-62: rgba(26, 24, 21, 0.62);
    --ink-82: rgba(26, 24, 21, 0.82);
    --accent: #C2410C;
    --accent-hover: #A8380A;
    --accent-soft: rgba(194, 65, 12, 0.18);
    --font-sans: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-serif: "Spectral", "Source Serif Pro", Georgia, serif;
    --chamfer-size: 8px;
    --chamfer-inner: 7px;
    --ease-default: cubic-bezier(0.32, 0.72, 0.32, 1);
    --dur-base: 250ms;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--paper); }
  body { font-family: var(--font-sans); }
  /* small crosshair cursor everywhere */
  *, *::before, *::after { cursor: crosshair !important; }
  ::selection { background: var(--accent-soft); }

  /* ─────────────────────────────────────────────────────────────
     Design system buttons — chamfered outline + composed hover.
     Outer layer (the .ds-btn itself) is filled with the BORDER color.
     Inner layer (.ds-btn::before) is inset 1px and filled with the
     actual button background (or the surface color for tertiary).
     The visible 1px gap between them IS the border, and because both
     layers share the chamfer shape the outline traces the cut corners
     with no broken edges.
     ───────────────────────────────────────────────────────────── */
  .ds-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 10px 16px;
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    line-height: 1;
    cursor: pointer;
    border: none;
    background: transparent;
    user-select: none;
    /* 6-point polygon at rest matches the 6-point hover polygon so the
       chamfer animates smoothly. CSS can only interpolate clip-path
       polygons when both have the same vertex count. The two "cut"
       vertices are placed at the corners (0 0 and 100% 100%) so visually
       no corner is cut at rest. */
    clip-path: polygon(0 0, 100% 0, 100% 100%, 100% 100%, 0 100%, 0 0);
    transition:
      clip-path var(--dur-base) var(--ease-default),
      background-color var(--dur-base) var(--ease-default),
      color var(--dur-base) var(--ease-default);
  }
  .ds-btn::before {
    content: "";
    position: absolute;
    inset: 1px;
    z-index: 0;
    background: transparent;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 100% 100%, 0 100%, 0 0);
    transition:
      clip-path var(--dur-base) var(--ease-default),
      background-color var(--dur-base) var(--ease-default);
  }
  .ds-btn > * { position: relative; z-index: 1; }

  /* Reserve the bold-state width so the button doesn't resize on hover.
     Each text child uses ::before to render an invisible bold "ghost"
     of itself that sets the slot's width. The visible text sits on top
     and switches between weight 500 and 600 without affecting layout. */
  .ds-btn > span:not(.ds-btn-arrow) {
    position: relative;
    display: inline-block;
  }
  .ds-btn > span:not(.ds-btn-arrow)::before {
    content: attr(data-text);
    display: block;
    height: 0;
    overflow: hidden;
    visibility: hidden;
    font-weight: 600;
    /* inherit letter-spacing/text-transform from parent so the ghost
       measures identically to the bold visible text */
  }

  .ds-btn:hover:not(:disabled) {
    font-weight: 600;
    clip-path: polygon(
      var(--chamfer-size) 0, 100% 0,
      100% calc(100% - var(--chamfer-size)),
      calc(100% - var(--chamfer-size)) 100%,
      0 100%, 0 var(--chamfer-size)
    );
  }
  .ds-btn:hover:not(:disabled)::before {
    clip-path: polygon(
      var(--chamfer-inner) 0, 100% 0,
      100% calc(100% - var(--chamfer-inner)),
      calc(100% - var(--chamfer-inner)) 100%,
      0 100%, 0 var(--chamfer-inner)
    );
  }

  /* Primary — accent fill */
  .ds-btn-primary { background: var(--accent); color: var(--paper); }
  .ds-btn-primary::before { background: var(--accent); }
  .ds-btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .ds-btn-primary:hover:not(:disabled)::before { background: var(--accent-hover); }

  /* Secondary — ink fill */
  .ds-btn-secondary { background: var(--ink); color: var(--paper); }
  .ds-btn-secondary::before { background: var(--ink); }
  .ds-btn-secondary:hover:not(:disabled) { background: var(--ink-hover); }
  .ds-btn-secondary:hover:not(:disabled)::before { background: var(--ink-hover); }

  /* Tertiary — accent border, transparent (paper) fill */
  .ds-btn-tertiary { background: var(--accent); color: var(--accent); }
  .ds-btn-tertiary::before { background: var(--paper); }
  .ds-btn-tertiary:hover:not(:disabled) { background: var(--accent-hover); color: var(--accent-hover); }
  /* inner stays paper — only the outline shifts */

  /* Icon button sizes — three standard square sizes. */
  .ds-btn-icon-sm { width: 28px; height: 28px; }
  .ds-btn-icon-md { width: 40px; height: 40px; }
  .ds-btn-icon-lg { width: 48px; height: 48px; }

  /* Icon button — accent border, accent icon. Transparent (paper) fill.
     Canonical rest state shared with all icon buttons across the system. */
  .ds-btn-icon {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    padding: 0;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 100% 100%, 0 100%, 0 0);
    transition:
      background-color var(--dur-base) var(--ease-default),
      color var(--dur-base) var(--ease-default),
      clip-path var(--dur-base) var(--ease-default);
  }
  .ds-btn-icon::before {
    content: "";
    position: absolute;
    inset: 1px;
    background: var(--paper);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 100% 100%, 0 100%, 0 0);
    transition: clip-path var(--dur-base) var(--ease-default);
  }
  .ds-btn-icon > * { position: relative; z-index: 1; }
  .ds-btn-icon:hover:not(:disabled) {
    background: var(--accent-hover);
    color: var(--accent-hover);
    clip-path: polygon(
      var(--chamfer-size) 0, 100% 0,
      100% calc(100% - var(--chamfer-size)),
      calc(100% - var(--chamfer-size)) 100%,
      0 100%, 0 var(--chamfer-size)
    );
  }
  .ds-btn-icon:hover:not(:disabled)::before {
    clip-path: polygon(
      var(--chamfer-inner) 0, 100% 0,
      100% calc(100% - var(--chamfer-inner)),
      calc(100% - var(--chamfer-inner)) 100%,
      0 100%, 0 var(--chamfer-inner)
    );
  }

  /* Disabled — strip all hover responses */
  .ds-btn:disabled,
  .ds-btn-icon:disabled { opacity: 0.35; cursor: not-allowed; }
  .ds-btn:disabled:hover,
  .ds-btn-icon:disabled:hover { clip-path: polygon(0 0, 100% 0, 100% 100%, 100% 100%, 0 100%, 0 0); font-weight: 500; }
  .ds-btn:disabled:hover::before,
  .ds-btn-icon:disabled:hover::before { clip-path: polygon(0 0, 100% 0, 100% 100%, 100% 100%, 0 100%, 0 0); }
  .ds-btn:disabled:hover .ds-btn-arrow { transform: translateX(0); }

  /* Trailing arrow — slides right on hover */
  .ds-btn-arrow {
    display: inline-block;
    transition: transform var(--dur-base) var(--ease-default);
  }
  .ds-btn:hover:not(:disabled) .ds-btn-arrow { transform: translateX(3px); }
</style>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
// ─────────────────────────────────────────────────────────────────────────────
// Portfolio Dial — Haz.
// Original utility/HUD aesthetic: warm paper, mono type, dial with 4 projects
// orbiting near 3 o'clock, active item expanded as an inline accordion.
//
// Interactions:
//   ↑ ↓ ← →     rotate through projects (clamped at ends)
//   scroll      rotate through projects (clamped at ends)
//   Enter / ⎵   open active project
//   Esc         close detail panel
//   click ▲ ▼   step prev/next via the indicator-flanking arrows
// ─────────────────────────────────────────────────────────────────────────────

const PROJECTS = [
  {
    id: 'philpotpearce',
    title: 'PHILPOT—PEARCE',
    role: 'Lead Product Designer',
    year: '2024 — present',
    tags: ['Identity', 'Product', 'Web'],
    image: 'Blurry Chair Background.png',
    summary: 'End-to-end product and identity for a London-based studio. Type system, motion language, component library, and a static site that scores 100 on every Lighthouse axis.',
    metrics: [
      ['ENGAGEMENT', '+ 42.0', '%'],
      ['LOAD TIME', '— 1.18', 's'],
      ['COMPONENTS', '128', ''],
    ],
  },
  {
    id: 'gwi',
    title: 'GWI',
    role: 'Senior Designer',
    year: '2023',
    tags: ['Dataviz', 'Dashboard', 'B2B'],
    image: 'London Nightscape Mockup.png',
    summary: "Reworked the audience-insights dashboard for the world's largest consumer-research platform. Reduced query-to-insight time by half through progressive disclosure and a unified chart grammar.",
    metrics: [
      ['TIME-TO-INSIGHT', '— 51.4', '%'],
      ['NPS', '+ 18', 'pt'],
      ['CHARTS', '36', ''],
    ],
  },
  {
    id: 'lexisnexis',
    title: 'LEXISNEXIS',
    role: 'Design Consultant',
    year: '2022',
    tags: ['Enterprise', 'Search', 'AI'],
    image: 'Nature Technology Mockup.png',
    summary: 'Designed the legal-search experience for an AI-augmented research tool used by 60,000 lawyers. Citation-first results, source-grounded summaries, and a deterministic disclosure pattern.',
    metrics: [
      ['SEARCHES / DAY', '410k', ''],
      ['CITATION RATE', '99.2', '%'],
      ['LAWYERS', '60 030', ''],
    ],
  },
  {
    id: 'soundtrends',
    title: 'SOUNDTRENDS',
    role: 'Product Designer',
    year: '2021',
    tags: ['Audio', 'Discovery', 'Mobile'],
    image: 'Blurry Chair Background.png',
    summary: 'Reimagined music discovery for a long-running app with a loyal but ageing user base. Native iOS, audio-first navigation, daily mixtape rituals, and a typography pass that doubled DAU retention.',
    metrics: [
      ['DAU RETENTION', '+ 104', '%'],
      ['SESSIONS', '+ 38.0', '%'],
      ['STREAMS', '2.4 M', ''],
    ],
  },
];

// Final values from the design chat (replace tweaks panel).
const CONFIG = {
  dialSize: 1200,
  hudOn: true,
  accent: '#C2410C', // var(--accent) — design system accent
  arcSpread: 110, // degrees of arc the headings span around 3 o'clock
};

// ── Geometry utils ─────────────────────────────────────────────────────────
const TAU = Math.PI * 2;
const SLOT_ANGLE = (i, n = PROJECTS.length) => (i * TAU) / n;

// ── Hooks ───────────────────────────────────────────────────────────────────
function useTransitionAngle(activeIdx, step) {
  // Each time activeIdx changes by `delta`, items effectively jump by `delta*step`
  // in angular space. We animate that jump back to 0 so they glide instead.
  const [residual, setResidual] = React.useState(0);
  const prevIdxRef = React.useRef(activeIdx);
  const rafRef = React.useRef(null);

  React.useEffect(() => {
    const delta = activeIdx - prevIdxRef.current;
    prevIdxRef.current = activeIdx;
    if (delta === 0) return;
    setResidual((r) => r + delta * step);
    cancelAnimationFrame(rafRef.current);
    const tick = () => {
      setResidual((r) => {
        if (Math.abs(r) < 0.0008) return 0;
        rafRef.current = requestAnimationFrame(tick);
        return r * 0.90;
      });
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [activeIdx, step]);

  return residual;
}

// ── Tick ring (SVG) ─────────────────────────────────────────────────────────
function TickRing({ size, accent, hudOn }) {
  const r = size / 2;
  // Thinner tick band so the inner hairline pulls outward, leaving more
  // breathing room from the outermost dot ring at 0.90r.
  // Was: inner = r-8, outer = r, inner hairline at r-22.
  // Now: inner = r-4, outer = r, inner hairline at r-13.
  const inner = r - 4;
  const outer = r;
  // 60 ticks total, 12 majors at every 30° (multiples of 5).
  const ticks = 60;
  const lines = [];
  for (let i = 0; i < ticks; i++) {
    const a = (i / ticks) * TAU;
    const major = i % 5 === 0;
    const len = major ? 8 : 3;
    const x1 = inner * Math.cos(a);
    const y1 = inner * Math.sin(a);
    const x2 = (inner - len) * Math.cos(a);
    const y2 = (inner - len) * Math.sin(a);
    lines.push(
      <line key={i} x1={x1} y1={y1} x2={x2} y2={y2}
        stroke={major ? 'rgba(26, 24, 21, 0.62)' : 'rgba(26, 24, 21, 0.22)'}
        strokeWidth={major ? 1 : 0.6} />
    );
  }
  const cardinals = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330];
  return (
    <svg width={size} height={size} style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}>
      {/* Tick ring is FIXED on screen so 12/3/6/9 always have a major tick. */}
      <g transform={`translate(${r} ${r})`}>
        <circle r={outer - 1} fill="none" stroke="rgba(26, 24, 21, 0.22)" strokeWidth="0.5" />
        {/* Inner hairline tightened to inner - 10 (was inner - 14) so it
            sits just beyond the tick marks rather than 14px inside, gaining
            outward breathing room from dot 3 at 0.90r. */}
        <circle r={inner - 10} fill="none" stroke="rgba(26, 24, 21, 0.12)" strokeWidth="0.5" />
        {lines}
      </g>
      {/* fixed indicator at 3 o'clock */}
      <g transform={`translate(${r} ${r})`}>
        <line x1={inner - 16} y1={0} x2={outer + 6} y2={0}
          stroke={accent} strokeWidth="1.2" />
        <circle cx={outer + 6} cy={0} r="3" fill={accent} />
        <circle cx={outer + 6} cy={0} r="6" fill="none" stroke={accent} strokeWidth="0.5" opacity=".6" />
      </g>
      {hudOn && (
        <g transform={`translate(${r} ${r})`} style={{
          font: '500 8px/1 "DM Sans", ui-sans-serif, system-ui, sans-serif', letterSpacing: '.08em',
          fill: 'rgba(26, 24, 21, 0.42)',
        }}>
          {cardinals.map((deg) => {
            const a = (deg * Math.PI) / 180;
            const lr = outer + 18;
            const x = lr * Math.cos(a);
            const y = lr * Math.sin(a);
            const label = String(deg).padStart(3, '0') + '°';
            return (
              <text key={deg} x={x} y={y} textAnchor="middle" dominantBaseline="middle">{label}</text>
            );
          })}
        </g>
      )}
    </svg>
  );
}

// ── Dot field background ────────────────────────────────────────────────────
function DotField({ size, angle, accent }) {
  // Concentric dot rings — gently rotate during a selection change, but
  // always settle to 0° so they re-align to the 12-section clock grid at
  // rest. Ring counts are multiples of 12 so cardinals land on dots.
  const r = size / 2;
  const rings = [];
  // Three rings spread across the band between the image edge and the
  // tick ring, with equal 0.06r spacing across all five concentric rings:
  //   image edge (0.72r) → dot 1 (0.78r) → dot 2 (0.84r) → dot 3 (0.90r)
  //   → inner tick hairline (~0.96r at the dial edge).
  // Every gap is now uniform at 0.06r.
  const ringSpecs = [
    { radius: r * 0.78, count: 36, dot: 1.8, op: 0.85, isActive: true },
    { radius: r * 0.84, count: 60, dot: 1.4, op: 0.5  },
    { radius: r * 0.90, count: 84, dot: 1.2, op: 0.4  },
  ];
  ringSpecs.forEach((spec, ri) => {
    for (let i = 0; i < spec.count; i++) {
      const a = (i / spec.count) * TAU;
      const x = spec.radius * Math.cos(a);
      const y = spec.radius * Math.sin(a);
      const fill = spec.isActive ? 'rgba(26, 24, 21, 0.82)' : `rgba(26, 24, 21, ${spec.op})`;
      rings.push(<circle key={`${ri}-${i}`} cx={x} cy={y} r={spec.dot} fill={fill} />);
    }
  });
  // Cardinal cross hairs removed entirely for a cleaner dial.
  const hairs = [];
  // Anchor cardinal hairs to the dot-ring rhythm: start just inside the
  // innermost ring, finish just inside the outermost ring.
  const hairInner = r * 0.30;
  const hairOuter = r * 0.78;
  return (
    <svg width={size} height={size} style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}>
      {/* Dot rings rotate with the transient `angle` (which decays to 0
          between selections) so they nudge during a change but settle
          perfectly aligned to 12 / 3 / 6 / 9 at rest. */}
      <g transform={`translate(${r} ${r}) rotate(${(angle * 180) / Math.PI})`}>
        {rings}
      </g>
      {/* fixed cardinal hairs */}
      <g transform={`translate(${r} ${r})`}>
        {hairs.map((h, i) => {
          const a = (h.angleDeg * Math.PI) / 180;
          const x1 = hairInner * Math.cos(a);
          const y1 = hairInner * Math.sin(a);
          const x2 = hairOuter * Math.cos(a);
          const y2 = hairOuter * Math.sin(a);
          return (
            <line key={i} x1={x1} y1={y1} x2={x2} y2={y2}
              stroke={h.stroke} strokeWidth={h.width} opacity={h.opacity} strokeLinecap="round" />
          );
        })}
      </g>
    </svg>
  );
}

// ── Circular project image at dial center ────────────────────────────────
function CenterImage({ project, size }) {
  return (
    <div style={{
      position: 'absolute', left: '50%', top: '50%',
      width: size, height: size,
      transform: 'translate(-50%, -50%)',
      borderRadius: '50%',
      overflow: 'hidden',
      boxShadow: '0 0 0 1px rgba(26, 24, 21, 0.22), 0 0 0 6px #F5F3EE, 0 0 0 7px rgba(26, 24, 21, 0.12)',
      background: '#ECEAE3',
      pointerEvents: 'none',
    }}>
      {/* Same <img> node across project changes — only the src updates, so
          there's no scale/fade animation on swap. */}
      <img
        src={encodeURI(project.image)}
        alt={project.title}
        style={{
          position: 'absolute', inset: 0,
          width: '100%', height: '100%',
          objectFit: 'cover',
          objectPosition: 'center',
        }}
      />
    </div>
  );
}

// ── Up / Down arrows next to the 3 o'clock indicator ───────────────────────
function NavArrows({ dialSize, accent, canPrev, canNext, onPrev, onNext }) {
  const baseLeft = dialSize + 18;
  const offsetY = 22;
  // Position is layout-specific (inline). Size + shape come from the DS class.
  const posStyle = (top) => ({
    position: 'absolute',
    left: baseLeft,
    pointerEvents: 'auto',
    top,
  });
  return (
    <React.Fragment>
      <button
        type="button"
        aria-label="Previous project"
        onClick={() => canPrev && onPrev()}
        disabled={!canPrev}
        className="ds-btn-icon ds-btn-icon-sm"
        style={posStyle(`calc(50% - ${offsetY + 28}px)`)}
      >
        <svg width="11" height="7" viewBox="0 0 11 7" aria-hidden>
          <path d="M1 6 L5.5 1 L10 6" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      </button>
      <button
        type="button"
        aria-label="Next project"
        onClick={() => canNext && onNext()}
        disabled={!canNext}
        className="ds-btn-icon ds-btn-icon-sm"
        style={posStyle(`calc(50% + ${offsetY}px)`)}
      >
        <svg width="11" height="7" viewBox="0 0 11 7" aria-hidden>
          <path d="M1 1 L5.5 6 L10 1" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      </button>
    </React.Fragment>
  );
}

// ── CTA below the active heading ─────────────────────────────────────────
// Primary button: filled accent, paper text. Full design system hover.
function ActiveCTA({ project, accent, onOpen }) {
  return (
    <button
      type="button"
      onClick={() => onOpen(project.id)}
      className="ds-btn ds-btn-primary"
    >
      <span data-text="View Project">View Project</span>
      <span className="ds-btn-arrow" aria-hidden>→</span>
    </button>
  );
}

function HeadingItem({ project, idx, x, y, isActive, opacity, hidden, accent, onSelect, onOpen }) {
  return (
    <div style={{
      position: 'absolute', left: 0, top: 0,
      transform: `translate(${x}px, ${y}px)`,
      transition: 'transform .85s cubic-bezier(.32,.72,.32,1)',
      pointerEvents: hidden ? 'none' : 'auto',
    }}>
      <div
        onClick={() => {
          if (hidden) return;
          isActive ? onOpen() : onSelect();
        }}
        style={{
          transform: 'translateY(-50%)',
          opacity,
          transition: 'opacity .55s cubic-bezier(.32,.72,.32,1), transform .85s cubic-bezier(.32,.72,.32,1)',
          userSelect: 'none', whiteSpace: 'nowrap',
        }}
      >
        {/* connector tick row — P/NN identifier with leading rule */}
        <div style={{
          display: 'flex', alignItems: 'center', gap: 10,
          font: '500 10px/1 "DM Sans", ui-sans-serif, system-ui, sans-serif', letterSpacing: '.22em',
          color: isActive ? accent : 'rgba(26, 24, 21, 0.62)',
          transition: 'color .55s cubic-bezier(.32,.72,.32,1)',
        }}>
          <span style={{
            width: isActive ? 26 : 14, height: 1, background: 'currentColor',
            opacity: .65, transition: 'width .7s cubic-bezier(.32,.72,.32,1)',
          }} />
          <span>P/{String(idx + 1).padStart(2, '0')}</span>
        </div>

        <div style={{
          marginTop: 6, paddingLeft: 22,
          font: `${isActive ? 600 : 500} ${isActive ? 28 : 20}px/1 "DM Sans", ui-sans-serif, system-ui, sans-serif`,
          letterSpacing: '.04em', color: '#1A1815',
          transition: 'font-size .55s cubic-bezier(.32,.72,.32,1), font-weight .55s cubic-bezier(.32,.72,.32,1)',
        }}>
          {project.title}
        </div>

        <div style={{

function OrbitingHeadings({ projects, activeIdx, radius, dialAngle, arcSpread, accent, onSelect, onOpen }) {
  const n = projects.length;
  const arcRad = (arcSpread * Math.PI) / 180;
  const step = n > 1 ? arcRad / (n - 1) : 0;

  return (
    <div style={{
      position: 'absolute', left: '50%', top: '50%',
      width: 0, height: 0, pointerEvents: 'none',
    }}>
      {projects.map((p, i) => {
        const offset = i - activeIdx;
        const a = offset * step + dialAngle;
        const x = radius * Math.cos(a);
        const y = radius * Math.sin(a);
        const isActive = i === activeIdx;
        const dist = Math.abs(a);
        // Items more than 2 slots away from the active one are hidden — so the
        // 4th heading disappears when project 1 is selected, and the 1st
        // disappears when project 4 is selected. Smooth via opacity transition.
        const hidden = Math.abs(offset) > 2;
        const opacity = hidden
          ? 0
          : (isActive ? 1 : Math.max(0.3, 0.7 - dist * 1.6));
        return (
          <HeadingItem
            key={p.id}
            project={p}
            idx={i}
            x={x}
            y={y}
            isActive={isActive}
            opacity={opacity}
            hidden={hidden}
            accent={accent}
            onSelect={() => onSelect(i)}
            onOpen={() => onOpen(p.id)}
          />
        );
      })}
    </div>
  );
}

// ── Main component ─────────────────────────────────────────────────────────
function PortfolioDial() {
  const [activeIdx, setActiveIdx] = React.useState(0);
  const [open, setOpen] = React.useState(null);
  const n = PROJECTS.length;
  const accent = CONFIG.accent;

  // Track which way the user moved most recently — drives the mobile card
  // slide direction. +1 = forward (next), -1 = backward (prev), 0 = initial.
  const [direction, setDirection] = React.useState(0);
  const prevActiveRef = React.useRef(activeIdx);
  React.useEffect(() => {
    const delta = activeIdx - prevActiveRef.current;
    if (delta !== 0) setDirection(delta > 0 ? 1 : -1);
    prevActiveRef.current = activeIdx;
  }, [activeIdx]);

  const [vp, setVp] = React.useState(() => ({ w: window.innerWidth, h: window.innerHeight }));
  React.useEffect(() => {
    const onResize = () => setVp({ w: window.innerWidth, h: window.innerHeight });
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  const arcRad = (CONFIG.arcSpread * Math.PI) / 180;
  const slotStep = n > 1 ? arcRad / (n - 1) : 0;
  const dialAngle = useTransitionAngle(activeIdx, slotStep);
  // Dial graphics rotate with just the transient residual — at rest this is 0
  // so the dot field is always aligned to the 12-section clock grid.
  const visualAngle = dialAngle;

  // Inputs (keyboard always; wheel on desktop only — mobile uses swipe).
  const wheelLockRef = React.useRef(0);
  React.useEffect(() => {
    const onKey = (e) => {
      if (open) {
        if (e.key === 'Escape') setOpen(null);
        return;
      }
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
        e.preventDefault();
        setActiveIdx((i) => Math.min(i + 1, n - 1));
      } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
        e.preventDefault();
        setActiveIdx((i) => Math.max(i - 1, 0));
      } else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        setOpen(PROJECTS[activeIdx].id);
      }
    };
    window.addEventListener('keydown', onKey);

    let cleanupWheel = () => {};
    if (vp.w > 720) {
      const onWheel = (e) => {
        if (open) return;
        e.preventDefault();
        const now = Date.now();
        if (now - wheelLockRef.current < 220) return;
        wheelLockRef.current = now;
        const dir = e.deltaY > 0 || e.deltaX > 0 ? 1 : -1;
        setActiveIdx((i) => Math.max(0, Math.min(n - 1, i + dir)));
      };
      window.addEventListener('wheel', onWheel, { passive: false });
      cleanupWheel = () => window.removeEventListener('wheel', onWheel);
    }

    return () => {
      window.removeEventListener('keydown', onKey);
      cleanupWheel();
    };
  }, [activeIdx, n, open, vp.w]);

  // Mobile breakpoint: stack dial above active card + pager.
  const isMobile = vp.w <= 720;

  // Layout / sizing
  const ORBIT_PAD = 96; // gap between dial edge and the active heading anchor
  const ACTIVE_PANEL_W = 460;
  const HUD_V = 90;
  const SAFE_MARGIN = 20;
  const dialShift = isMobile ? 0 : ACTIVE_PANEL_W * 0.6;
  let dialSize;
  if (isMobile) {
    // Mobile: condense the dial. Cap so card + pager have room. The image is
    // the focal point (CenterImage is 0.72 of dialSize on desktop, 0.76 on
    // mobile). Aim ~70vw, hard cap 320, never larger than vh*0.45.
    const byW = vp.w * 0.7;
    const byH = vp.h * 0.45;
    dialSize = Math.max(220, Math.min(320, byW, byH));
  } else {
    const halfW = vp.w / 2;
    const rByLeft = (halfW - dialShift) - SAFE_MARGIN;
    const rByRight = (halfW + dialShift) - SAFE_MARGIN - ORBIT_PAD - ACTIVE_PANEL_W;
    const rByH = (vp.h - 2 * HUD_V) / 2;
    const maxRadius = Math.max(180, Math.min(rByLeft, rByRight, rByH));
    const maxDiameter = maxRadius * 2;
    dialSize = Math.min(CONFIG.dialSize, maxDiameter);
  }
  const active = PROJECTS[activeIdx];

  // Touch swipe (mobile): horizontal drag → prev/next. Threshold 40px;
  // dominant horizontal axis; clamped at ends.
  const touchRef = React.useRef(null);
  const onTouchStart = (e) => {
    if (open) return;
    const t = e.touches[0];
    touchRef.current = { x: t.clientX, y: t.clientY, fired: false };
  };
  const onTouchMove = (e) => {
    if (!touchRef.current || touchRef.current.fired) return;
    const t = e.touches[0];
    const dx = t.clientX - touchRef.current.x;
    const dy = t.clientY - touchRef.current.y;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      touchRef.current.fired = true;
      if (dx < 0) setActiveIdx((i) => Math.min(i + 1, n - 1));
      else        setActiveIdx((i) => Math.max(i - 1, 0));
    }
  };
  const onTouchEnd = () => { touchRef.current = null; };

  return (
    <div
      onTouchStart={isMobile ? onTouchStart : undefined}
      onTouchMove={isMobile ? onTouchMove : undefined}
      onTouchEnd={isMobile ? onTouchEnd : undefined}
      style={{
        position: 'fixed', inset: 0, overflow: 'hidden',
        background: '#F5F3EE',
        color: '#1A1815',
        fontFamily: '"DM Sans", ui-sans-serif, system-ui, sans-serif',
      }}
    >
      <div aria-hidden style={{
        position: 'absolute', inset: 0, pointerEvents: 'none', opacity: .35,
        background: 'radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(26, 24, 21, 0.06))',
      }} />

      {isMobile ? (
        // ── Mobile layout: dial centered top, then card, then pager ───────
        <div style={{
          position: 'absolute', inset: 0,
          display: 'flex', flexDirection: 'column', alignItems: 'center',
          paddingTop: 28,
          // Reserve space at bottom so the fixed-position mini-map doesn't
          // overlay the active card.
          paddingBottom: 90,
          gap: 32,
          overflow: 'auto',
        }}>
          <div style={{
            position: 'relative',
            width: dialSize, height: dialSize,
            flexShrink: 0,
          }}>
            <DotField size={dialSize} angle={visualAngle} accent={accent} />
            <TickRing size={dialSize} accent={accent} hudOn={CONFIG.hudOn} />
            <CenterImage project={active} size={Math.round(dialSize * 0.76)} />
          </div>

          <MobileNavArrows
            activeIdx={activeIdx}
            n={n}
            accent={accent}
            onPrev={() => setActiveIdx((i) => Math.max(0, i - 1))}
            onNext={() => setActiveIdx((i) => Math.min(n - 1, i + 1))}
          />

          <div style={{ width: '100%' }}>
            <MobileActiveCard
              project={active}
              idx={activeIdx}
              accent={accent}
              direction={direction}
              onOpen={(id) => setOpen(id)}
            />
          </div>
        </div>
      ) : (
        // ── Desktop layout: dial shifted left, orbiting headings to right ──
        <div style={{
          position: 'absolute', left: '50%', top: '50%',
          transform: `translate(calc(-50% - ${dialShift}px), -50%)`,
          width: dialSize, height: dialSize,
        }}>
          <DotField size={dialSize} angle={visualAngle} accent={accent} />
          <TickRing size={dialSize} accent={accent} hudOn={CONFIG.hudOn} />
          <CenterImage project={active} size={Math.round(dialSize * 0.72)} />

          <OrbitingHeadings
            projects={PROJECTS}
            activeIdx={activeIdx}
            radius={dialSize / 2 + ORBIT_PAD}
            dialAngle={dialAngle}
            arcSpread={CONFIG.arcSpread}
            accent={accent}
            onSelect={setActiveIdx}
            onOpen={(id) => setOpen(id)}
          />

          <NavArrows
            dialSize={dialSize}
            accent={accent}
            canPrev={activeIdx > 0}
            canNext={activeIdx < n - 1}
            onPrev={() => setActiveIdx((i) => Math.max(0, i - 1))}
            onNext={() => setActiveIdx((i) => Math.min(n - 1, i + 1))}
          />
        </div>
      )}

      {/* HUD: bottom-left mini-map + bottom-right "All Projects" nav.
          onAllProjects is a placeholder — wire it to your routing or
          list-view handler when integrating. */}
      {CONFIG.hudOn && (
        <HudFooter
          accent={accent}
          activeIdx={activeIdx}
          n={n}
          onAllProjects={() => {
            // TODO: navigate to all-projects view
            console.log('All Projects clicked');
          }}
        />
      )}

      {open && (
        <DetailPanel
          project={PROJECTS.find((p) => p.id === open)}
          accent={accent}
          onClose={() => setOpen(null)}
        />
      )}

      <style>{`
        @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
        @keyframes ctaIn { 0% { opacity: 0; transform: translateY(8px) } 100% { opacity: 1; transform: translateY(0) } }
        @keyframes imgIn { 0% { opacity: 0; transform: scale(.96) } 100% { opacity: 1; transform: scale(1) } }
        @keyframes accIn { 0% { opacity: 0; transform: translateY(-6px) } 100% { opacity: 1; transform: translateY(0) } }
        @keyframes mobCardSlide {
          0%   { opacity: 0; transform: translateX(var(--card-slide-from, 28px)); }
          100% { opacity: 1; transform: translateX(0); }
        }
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PortfolioDial />);
</script>
</body>
</html>
